<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gold Robbers v2 – Gold Fever Frenzy preview</title>
<meta name="theme-color" content="#2a1a0e">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b120a;color:#fff7e0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#3b2614,#2a1a0e);border-bottom:2px solid #5a3a1c;gap:4px}
.pill{background:#00000055;border:1px solid #c8962e88;border-radius:20px;padding:5px 9px;font-weight:700;font-size:14px;white-space:nowrap}
#hud{display:flex;justify-content:space-around;align-items:center;padding:6px;background:#2a1a0e;gap:4px}
#hud .box{text-align:center;background:#0006;border-radius:12px;padding:4px 8px;min-width:84px}
#hud .big{font-size:20px;font-weight:900}
#hud .lbl{font-size:11px;opacity:.8}
#hud .box.red .big{color:#ff8a6a}
#hud .box.grn .big{color:#9cf07a}
#bar{height:8px;margin:0 10px 4px;background:#0006;border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3a,#e0402a);transition:width .2s}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#foot{text-align:center;font-size:12px;opacity:.8;padding:5px 8px calc(6px + env(safe-area-inset-bottom));background:#2a1a0e}
.btn{background:linear-gradient(#ffd34d,#e09a12);color:#3a2205;border:none;border-radius:14px;padding:14px 22px;font-weight:800;font-size:19px;box-shadow:0 4px 0 #8a5a08;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a08}
.btn.g{background:linear-gradient(#8fd16a,#4e9a2e);color:#0f2a05;box-shadow:0 4px 0 #2b5a17}
.btn.big{width:100%;font-size:22px;padding:15px}
.ov{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:6px}
.ov.on{display:flex}
.card{background:linear-gradient(#4a3018,#2a1a0e);border:3px solid #c8962e;border-radius:20px;padding:14px;width:92%;max-width:400px;text-align:center;max-height:98%;overflow:auto}
.card h2{margin:2px 0 6px;color:#ffd34d;font-size:26px}
.card p{margin:5px 0;font-size:16px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;background:#0005;border-radius:12px;padding:7px 11px;margin:5px 0;text-align:left;gap:8px;font-size:15px}
.row b{font-size:17px;white-space:nowrap}
.row.tot{background:#3e8f1f66;border:1px solid #9cf07a88}
.note{font-size:13px;opacity:.85;margin:6px 0 10px}
.how{text-align:left;background:#0005;border-radius:12px;padding:7px 11px;font-size:14.5px;line-height:1.4;margin:6px 0}
.pros{font-size:40px;line-height:1}
#call{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:40px;font-weight:900;color:#ffd34d;text-shadow:0 3px 0 #7a4a00,0 0 20px #ff9800;pointer-events:none;opacity:0;z-index:10}
#call small{display:block;font-size:20px;color:#fff7e0}
#call.go{animation:call 1.5s ease-out}
@keyframes call{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.2)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#bub{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
#bub.on{opacity:1}
#bub span{background:#fff7e0;color:#3a2205;border-radius:14px;padding:6px 10px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #0006}
#bub em{font-style:normal;font-size:34px}
#snd{background:none;border:none;font-size:20px;padding:2px 6px;color:#fff}
.ctl{position:absolute;bottom:8px;z-index:6;width:76px;height:76px;border-radius:50%;border:3px solid #c8962e;background:#2a1a0ecc;color:#fff7e0;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-family:inherit;box-shadow:0 3px 0 #0008}
.ctl:active{transform:translateY(2px)}
#rel{left:8px}#fire{right:8px;background:radial-gradient(#ff8a3a,#c0461a);border-color:#ffd34d;font-size:15px}
#rel canvas{width:46px;height:46px}
#rel.warn{border-color:#ff5a3a;animation:warn .4s infinite alternate}
@keyframes warn{to{background:#7a1a0acc}}
#game{display:none}#game.on{display:block}
@media (max-height:700px){.pros{font-size:30px}.card h2{font-size:22px;margin:0 0 4px}.row{padding:5px 10px;margin:4px 0}.card p{font-size:15px;margin:4px 0}.btn.big{padding:13px}#hud .big{font-size:18px}.ctl{width:66px;height:66px}#rel canvas{width:40px;height:40px}.how{font-size:13px;line-height:1.3}.pros{font-size:24px}.note{margin:4px 0 6px}}
</style></head><body>
<div id="app">
 <div class="top"><span class="pill">⛏️ Level 15 bonus</span><span class="pill" id="phase">🤠 Gold Robbers</span><span class="pill" id="tm">⏱ 26</span><button id="snd" aria-label="Sound on/off">🔊</button></div>
 <div id="hud">
  <div class="box"><div class="big" id="hRisk">120 oz</div><div class="lbl">Gold at risk</div></div>
  <div class="box red"><div class="big" id="hStolen">0 oz</div><div class="lbl">Stolen</div></div>
  <div class="box grn"><div class="big" id="hStop">0</div><div class="lbl" id="hStopL">Robbers stopped</div></div>
 </div>
 <div id="bar"><i id="barI"></i></div>
 <div id="wrap"><canvas id="cv"></canvas><div id="call"></div><div id="bub"><em>🤠</em><span id="bubT"></span></div>
  <div id="game"><button class="ctl" id="rel" aria-label="Reload"><canvas id="cyl" width="138" height="138"></canvas><span id="relT">RELOAD</span></button><button class="ctl" id="fire" aria-label="Fire">💥<br>FIRE</button></div>
  <div class="ov on" id="ov"><div class="card" id="card"></div></div>
 </div>
 <div id="foot">🔒 Robbers can't touch gold you bought · Preview only (v2), not the real game</div>
</div>
<script>
const $=id=>document.getElementById(id);
const START_OZ=1200,BOUGHT_OZ=300,CAP=Math.round(START_OZ*.10),PER=15,BOSS_TAKE=30,PERFECT_BONUS=25;
const DEFEND_MAX=27,CHASE_S=10,MAG=6,PER_BULLET=.2,RELOAD_BASE=.35,AUTO_DELAY=.3;
// ---------- sound (same synth helpers as the game) ----------
let AC=null,muted=false,vbuf={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d=.12,type='square',vol=.08,slide=0,delay=0){if(muted||!AC)return;try{if(AC.state==='suspended')AC.resume();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.25,vol=.2,delay=0,freq=700,type='lowpass'){if(muted||!AC)return;try{const t=AC.currentTime+delay,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t)}catch(e){}}
const SFX={
 pop:()=>{noise(.07,.35,0,2500,'bandpass');tone(900,.06,'square',.05,-500)},
 bonk:()=>{tone(520,.1,'triangle',.12,-300);noise(.08,.15)},
 empty:()=>{tone(1800,.03,'square',.05);tone(1400,.03,'square',.04,0,.05)},
 load:(i)=>tone(1300+i*60,.035,'square',.035),
 spin:()=>{noise(.25,.08,0,3000,'highpass')},
 coin:(n=0)=>{const f=660*Math.pow(1.06,n);tone(f,.09,'square',.05,0);tone(f*1.5,.12,'square',.05,0,.07)},
 steal:()=>{tone(300,.25,'sawtooth',.05,-180)},
 whistle:()=>{tone(1200,.18,'sine',.06,600);tone(1800,.25,'sine',.05,-700,.2)},
 boss:()=>{[196,185,175,165].forEach((f,i)=>tone(f,.22,'sawtooth',.05,0,i*.18))},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'square',.06,0,i*.12))},
 click:()=>tone(880,.05,'square',.04)};
function vload(k){if(vbuf[k]||!AC)return vbuf[k];vbuf[k]=fetch(k+'.mp3?v=2').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)));vbuf[k].catch(()=>{vbuf[k]=null});return vbuf[k]}
function voice(k){if(muted||!AC)return;const p=vload(k);if(p)p.then(buf=>{if(muted)return;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.1;s.buffer=buf;s.connect(g);g.connect(AC.destination);s.start()}).catch(()=>{})}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊'};

const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);if(G&&G.me)G.me.x=Math.max(90,Math.min(W-90,G.me.x||W/2))}
addEventListener('resize',size);
const pile=()=>({x:W/2,y:H*.6,r:Math.min(W,H)*.13});
const groundY=()=>H-14;
const SC=()=>Math.max(1.05,Math.min(1.45,W/300));

// ---------- waves: [start s, count, interval s, fast count] ----------
const WAVES=[[0,7,1.0,1],[7.5,9,.78,3],[15,11,.6,4]];
const BOSS_AT=18;
let G=null;window.__G=()=>G;
function fresh(){return{phase:'intro',t:0,el:0,robbers:[],corks:[],sacks:[],fx:[],puffs:[],hats:[],stolen:0,stopped:0,escaped:[],recovered:0,caught:0,queue:[],chasers:[],shots:0,hits:0,
 ammo:MAG,reload:0,reloadDur:0,autoT:0,me:{x:W/2||180,aim:-Math.PI/2,kick:0,walk:0},bossDone:false,wave:0}}
G=fresh();
function buildQueue(){const q=[];WAVES.forEach((w,wi)=>{const fastIdx=new Set();while(fastIdx.size<w[3])fastIdx.add(1+Math.floor(Math.random()*(w[1]-1)));for(let i=0;i<w[1];i++)q.push({at:w[0]+i*w[2]+Math.random()*.25,type:fastIdx.has(i)?'fast':'norm',wave:wi})});q.push({at:BOSS_AT,type:'boss',wave:2});return q.sort((a,b)=>a.at-b.at)}
function setHud(){const lost=G.stolen-G.recovered;$('hStolen').textContent=Math.round(lost)+' oz';$('hStop').textContent=G.phase==='chase'?G.caught:G.stopped;$('hStopL').textContent=G.phase==='chase'?'Robbers caught':'Robbers stopped';$('barI').style.width=Math.min(100,lost/CAP*100)+'%'}
function call(t,sub=''){const c=$('call');c.innerHTML=t+(sub?`<small>${sub}</small>`:'');c.classList.remove('go');void c.offsetWidth;c.classList.add('go')}
let bubTO;function bub(t,ms=2000){$('bubT').textContent=t;$('bub').classList.add('on');clearTimeout(bubTO);bubTO=setTimeout(()=>$('bub').classList.remove('on'),ms)}
function float(x,y,txt,col='#ffd34d',sz=20){x=Math.max(50,Math.min(W-50,x));y=Math.max(24,y);G.fx.push({x,y,txt,col,sz,life:1})}

function intro(){
 $('game').classList.remove('on');
 $('card').innerHTML=`<div class="pros">🤠</div><h2>Gold Robbers!</h2>
 <p><b>Every 15 levels</b> an outlaw gang rides in for your gold!</p>
 <div class="how">👆 <b>Tap a robber</b> to fire your cork six-shooter. Pop! His hat flies off and he drops the sack.<br>↔️ <b>Drag</b> along the bottom to move. 💥 FIRE shoots straight up.<br>🔄 <b>6 shots</b>, then reload. Tap the cylinder to reload early.<br>😈 3 waves, fast ones, and a <b>boss</b> (3 hits)!</div>
 <div class="row"><span>Gold you dug</span><b>${START_OZ.toLocaleString()} oz</b></div>
 <div class="row"><span>Most they can take (10%)</span><b>${CAP} oz</b></div>
 <p class="note">🔒 Robbers can't touch gold you bought (your ${BOUGHT_OZ} oz is safe).</p>
 <button class="btn g big" id="go">Defend my gold!</button>`;
 $('ov').classList.add('on');$('go').onclick=()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();['smokes','win1','hoser','close1','strike'].forEach(vload);SFX.click();startDefend()};
}
function startDefend(){G=fresh();G.me.x=W/2;G.phase='defend';G.queue=buildQueue();$('ov').classList.remove('on');$('game').classList.add('on');$('phase').textContent='🛡 Wave 1';setHud();call('Wave 1','Here they come!');voice('smokes');SFX.whistle()}

// ---------- robbers ----------
const COATS=[['#6b4423','#4a2e16'],['#4a4a52','#2e2e34'],['#7a5a32','#54391c'],['#3a4a3a','#253025']];
const BANDS=['#c0392b','#2a6ad0','#d07a1a','#7a2a8a'];
function spawn(q){const p=pile(),s=SC();let x,y;const side=Math.random();
 if(q.type==='boss'){x=W/2+(Math.random()<.5?-1:1)*W*.25;y=-60}
 else if(side<.55){x=30+Math.random()*(W-60);y=-50}else if(side<.78){x=-40;y=20+Math.random()*H*.3}else{x=W+40;y=20+Math.random()*H*.3}
 const base=(58+q.wave*14)*(H/560);
 const r={x,y,type:q.type,state:'run',ph:Math.random()*6,wob:Math.random()*6,t:0,scale:s*(q.type==='boss'?1.55:1),
  sp:q.type==='boss'?base*.62:q.type==='fast'?base*1.75:base*(0.9+Math.random()*.25),hp:q.type==='boss'?3:1,pend:0,id:Math.random(),
  coat:q.type==='boss'?['#1e1e22','#0e0e10']:COATS[(Math.random()*COATS.length)|0],band:q.type==='boss'?'#b01818':q.type==='fast'?'#2e9a3e':BANDS[(Math.random()*BANDS.length)|0],
  vest:q.type==='fast'||Math.random()<.3,hat:true,face:1,yell:''};
 r.face=x<p.x?1:-1;G.robbers.push(r);
 if(q.type==='boss'){G.bossDone=false;call('BOSS BANDIT!','3 hits to stop him');SFX.boss();bub('That\'s Big Bad Bart! Hit him 3 times!',2400)}}
function hitRobber(r,cx0,cy0){
 if(r.state!=='run'){return false}
 r.hp--;G.hits++;SFX.bonk();puff(cx0,cy0,1.3);G.fx.push({x:cx0+14,y:cy0-6,txt:'POP!',col:'#fff',sz:17,life:.7});
 if(r.hp>0){ // boss partial hit: hat (then bandana) flies, he stumbles back
  if(r.hat){r.hat=false;hatFly(r)}else r.bandanaDown=true;
  r.stun=.45;float(r.x,r.y-115*r.scale/1.55,['Hey!','Grrr!'][r.hp%2],'#fff',22);return true}
 r.state='scared';r.t=0;G.stopped++;if(r.hat){r.hat=false;hatFly(r)}
 const p=pile();G.sacks.push({x:r.x-10*r.face*r.scale,y:r.y-55*r.scale,tx:p.x,ty:p.y-10,t:0,boss:r.type==='boss'});
 r.yell=['Yikes!','My hat!','Skedaddle!','Aw shucks!','Run for it!','Yeeouch!'][(Math.random()*6)|0];float(r.x,r.y-95*r.scale,r.yell,'#fff');
 const ang=Math.atan2(r.y-p.y,r.x-p.x);r.vx=Math.cos(ang)*280;r.vy=Math.min(-80,Math.sin(ang)*280);r.face=r.vx>0?1:-1;
 if(r.type==='boss'){G.bossDone=true;call('Boss down!');voice('strike');coinBurst(r.x,r.y-40,14)}
 setHud();if(G.stopped%6===0&&r.type!=='boss')bub(['Nice shootin\', partner!','Beauty, eh!','Keep \'em comin\'!'][(G.stopped/6|0)%3],1400);return true}
function hatFly(r){G.hats.push({x:r.x,y:r.y-72*r.scale,vx:(Math.random()-.5)*160,vy:-260,rot:0,vr:(Math.random()<.5?-1:1)*9,s:r.scale,col:r.type==='boss'?'#141414':'#3b2a1a',life:1.4})}
function puff(x,y,s=1){for(let i=0;i<6;i++)G.puffs.push({x:x+(Math.random()-.5)*14*s,y:y+(Math.random()-.5)*14*s,r:5*s+Math.random()*5*s,vr:40*s,life:.5})}
function coinBurst(x,y,n){for(let i=0;i<n;i++)G.fx.push({x,y,coin:1,vx:(Math.random()-.5)*300,vy:-200-Math.random()*200,life:1})}

// ---------- six-shooter ----------
function muzzle(){const m=G.me,s=SC(),gy=groundY();const sx=m.x+10*s,sy=gy-58*s;return{x:sx+Math.cos(m.aim)*30*s,y:sy+Math.sin(m.aim)*30*s}}
function canShoot(){return G.phase==='defend'||G.phase==='chase'}
function startReload(manual){if(G.reload>0||G.ammo>=MAG)return;G.reloadDur=RELOAD_BASE+PER_BULLET*(MAG-G.ammo);G.reload=G.reloadDur;G.reloadFrom=G.ammo;SFX.spin();if(!manual&&anyThreat())bub('Reload, quick!',1100)}
function anyThreat(){return G.robbers.some(r=>r.state==='run')||G.chasers.some(c=>c.state==='flee')}
function shoot(tx,ty,target){
 if(!canShoot())return false;
 if(G.reload>0){SFX.empty();return false}
 if(G.ammo<=0){SFX.empty();if(!G.autoT)G.autoT=AUTO_DELAY;return false}
 const m=G.me;const s=SC(),sx=m.x+10*s,sy=groundY()-58*s;let a=Math.atan2(ty-sy,tx-sx);if(a>-.15&&a<Math.PI/2)a=-.15;else if(a>=Math.PI/2||a<-Math.PI+.15)a=-Math.PI+.15;m.aim=a;
 G.ammo--;G.shots++;m.kick=1;const mz=muzzle();SFX.pop();puff(mz.x,mz.y,.8);
 if(target)target.pend++;
 G.corks.push({x:mz.x,y:mz.y,tx,ty,target,sp:1050,free:!target,life:1.4,rot:0});
 if(G.ammo===0)G.autoT=AUTO_DELAY;return true}
function pickTarget(x,y){
 const list=G.phase==='chase'?G.chasers.filter(c=>c.state==='flee'):G.robbers.filter(r=>r.state==='run');let best=null,bd=1e9;
 for(const r of list){const R=(G.phase==='chase'?40:34)*r.scale,dx=r.x-x,dy=(r.y-40*r.scale)-y;const d=dx*dx+dy*dy*.6;if(d<R*R*1.6&&d<bd){bd=d;best=r}}return best}
// input
let drag=false;
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function moveTo(x){G.me.tx=Math.max(90,Math.min(W-90,x))}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(!canShoot())return;const p=pt(e);
 const tg=pickTarget(p.x,p.y);if(tg){shoot(tg.x,tg.y-40*tg.scale,tg);return}
 if(p.y>H-100){drag=true;moveTo(p.x);return}
 shoot(p.x,p.y,null)});
cv.addEventListener('pointermove',e=>{if(drag)moveTo(pt(e).x)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{drag=false}));
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();const s=SC();shoot(G.me.x+10*s,0,null)});
$('rel').addEventListener('pointerdown',e=>{e.preventDefault();if(canShoot())startReload(true)});

// ---------- phases ----------
function startChase(){
 G.phase='chase';G.t=CHASE_S;$('phase').textContent='🏃 Chase!';call('Chase!','Pop \'em to get your gold back');bub('After \'em, partner!');SFX.whistle();
 G.robbers=[];const n=G.escaped.length,top=H*.06,span=H*.48;
 G.escaped.forEach((e,i)=>{const dir=i%2?-1:1,lane=top+span*((i%5)+.7)/5;const s=SC()*(e.boss?1.3:1);
  G.chasers.push({type:e.boss?'boss':'norm',x:dir>0?-50-i*60:W+50+i*60,y:lane+60*s,dir,amt:e.amt,boss:e.boss,sp:(125+Math.random()*55)*(W/390),turns:1,state:'flee',ph:Math.random()*6,scale:s,coat:e.coat,band:e.band,vest:e.vest,hat:true,pend:0,face:dir})});
 setHud()}
function endGame(){
 G.phase='done';$('phase').textContent='🏁 Results';$('tm').textContent='⏱ 0';$('game').classList.remove('on');
 const lost=G.stolen-G.recovered,perfect=G.stolen===0,bonus=perfect?PERFECT_BONUS:0,keep=START_OZ-lost+bonus,acc=G.shots?Math.round(G.hits/G.shots*100):0;
 if(perfect){SFX.win();voice('hoser')}else if(lost===0){SFX.win();voice('win1')}else voice(lost>CAP/2?'close1':'win1');

   if(r.state==='run'){if(r.stun>0){r.stun-=dt;continue}const dx=p.x-r.x,dy=(p.y-p.r*.1)-r.y,d=Math.hypot(dx,dy);r.face=dx>0?1:-1;const wob=Math.sin(r.t*3+r.wob)*.45;

  if(tg&&tg.state==='run'||tg&&tg.state==='flee'){tx=tg.x;ty=tg.y-40*tg.scale}
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),st=c.sp*dt;
  if(tg&&!c.free){if(d<=st+6){c.dead=1;tg.pend--;if(tg.state==='run')hitRobber(tg,tx,ty);else if(tg.state==='flee')catchChaser(tg,tx,ty);else{c.dead=0;c.free=1;c.target=null;c.vx=dx/d*c.sp;c.vy=dy/d*c.sp}}else{c.x+=dx/d*st;c.y+=dy/d*st}}
  if(c.free&&!c.dead){if(c.vx==null){c.vx=dx/(d||1)*c.sp;c.vy=dy/(d||1)*c.sp}c.x+=c.vx*dt;c.y+=c.vy*dt;
   const hit=(G.phase==='chase'?G.chasers.filter(r=>r.state==='flee'):G.robbers.filter(r=>r.state==='run')).find(r=>Math.abs(r.x-c.x)<18*r.scale&&c.y>r.y-85*r.scale&&c.y<r.y-5);
   if(hit){c.dead=1;if(G.phase==='chase')catchChaser(hit,c.x,c.y);else hitRobber(hit,c.x,c.y)}
   else if(c.x<-20||c.x>W+20||c.y<-20||c.life<=0){c.dead=1;if(c.y>0&&c.x>0&&c.x<W)puff(c.x,c.y,.6)}}}
 G.corks=G.corks.filter(c=>!c.dead);
 // draw
 drawBg(t);
 for(const s of G.sacks){s.t+=dt*1.6;const k=Math.min(1,s.t);const x=s.x+(s.tx-s.x)*k,y=s.y+(s.ty-s.y)*k-Math.sin(k*Math.PI)*60;
  cx.fillStyle=s.boss?'#e8c048':'#c9a46a';cx.strokeStyle='#7a5a2a';cx.lineWidth=2;cx.beginPath();cx.ellipse(x,y,s.boss?14:10,s.boss?16:12,0,0,7);cx.fill();cx.stroke();cx.fillStyle='#ffd34d';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText('$',x,y+5);if(k>=1&&!s.done){s.done=1;SFX.coin(2)}}
 G.sacks=G.sacks.filter(s=>!s.done);
 const all=[...G.robbers,...(G.phase!=='defend'?G.chasers.filter(c=>c.state!=='gone'):[])].sort((a,b)=>a.y-b.y);
 for(const r of all)outlaw(r,t,{sack:r.state==='run'||r.state==='escape'||r.state==='flee',scared:r.state==='scared'});
 drawMe(t);
 for(const h of G.hats){h.vy+=600*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life-=dt;cx.save();cx.globalAlpha=Math.max(0,Math.min(1,h.life*2));cx.translate(h.x,h.y);cx.rotate(h.rot);cx.scale(h.s,h.s);cx.translate(0,76);drawHat(h.col,false);cx.restore()}
 G.hats=G.hats.filter(h=>h.life>0);
 for(const c of G.corks)drawCork(c);
 for(const q of G.puffs){q.life-=dt;q.r+=q.vr*dt;cx.globalAlpha=Math.max(0,q.life*1.6);cx.fillStyle='#fff';cx.beginPath();cx.arc(q.x,q.y,q.r,0,7);cx.fill()}cx.globalAlpha=1;
 G.puffs=G.puffs.filter(q=>q.life>0);
 if(G.phase==='defend'&&G.el<3.5){cx.font='900 14px system-ui';cx.textAlign='center';cx.fillStyle='#ffd34d';cx.textAlign='right';cx.fillText('YOU ▶',G.me.x-26*SC(),groundY()-40*SC())}
 for(const f of G.fx){f.life-=dt*.9;if(f.coin){f.vy+=500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;cx.globalAlpha=Math.max(0,f.life);nugget(f.x,f.y,6,t,1);cx.globalAlpha=1;continue}
  f.y-=40*dt;cx.globalAlpha=Math.max(0,f.life);cx.font=`900 ${f.sz}px system-ui`;cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#3a2205';cx.strokeText(f.txt,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.txt,f.x,f.y);cx.globalAlpha=1}
 G.fx=G.fx.filter(f=>f.life>0);
 drawCyl(t);
 requestAnimationFrame(frame)}
function catchChaser(c,x,y){if(c.state!=='flee')return;c.state='scared';G.hits++;G.recovered+=c.amt;G.caught++;SFX.bonk();SFX.coin(G.caught);puff(x,y,1.2);if(c.hat){c.hat=false;hatFly(c)}
 float(c.x,c.y-90*c.scale,'+'+c.amt+' oz','#9cf07a',22);c.vx=-c.dir*60;c.vy=-260;G.sacks.push({x:c.x,y:c.y-55*c.scale,tx:W/2,ty:-20,t:0,boss:c.boss});setHud()}
size();intro();setHud();requestAnimationFrame(frame);
