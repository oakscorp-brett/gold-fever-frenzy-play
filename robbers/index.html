<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gold Robbers – Gold Fever Frenzy preview</title>
<meta name="theme-color" content="#2a1a0e">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b120a;color:#fff7e0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#3b2614,#2a1a0e);border-bottom:2px solid #5a3a1c;gap:4px}
.pill{background:#00000055;border:1px solid #c8962e88;border-radius:20px;padding:5px 9px;font-weight:700;font-size:14px;white-space:nowrap}
#hud{display:flex;justify-content:space-around;align-items:center;padding:6px;background:#2a1a0e;gap:4px}
#hud .box{text-align:center;background:#0006;border-radius:12px;padding:4px 8px;min-width:84px}
#hud .big{font-size:20px;font-weight:900}
#hud .lbl{font-size:11px;opacity:.8}
#hud .box.red .big{color:#ff8a6a}
#hud .box.grn .big{color:#9cf07a}
#bar{height:8px;margin:0 10px 4px;background:#0006;border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3a,#e0402a);transition:width .2s}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#foot{text-align:center;font-size:12px;opacity:.8;padding:5px 8px calc(6px + env(safe-area-inset-bottom));background:#2a1a0e}
.btn{background:linear-gradient(#ffd34d,#e09a12);color:#3a2205;border:none;border-radius:14px;padding:14px 22px;font-weight:800;font-size:19px;box-shadow:0 4px 0 #8a5a08;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a08}
.btn.g{background:linear-gradient(#8fd16a,#4e9a2e);color:#0f2a05;box-shadow:0 4px 0 #2b5a17}
.btn.big{width:100%;font-size:22px;padding:16px}
.ov{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom))}
.ov.on{display:flex}
.card{background:linear-gradient(#4a3018,#2a1a0e);border:3px solid #c8962e;border-radius:20px;padding:14px;width:90%;max-width:400px;text-align:center;max-height:94%;overflow:auto}
.card h2{margin:2px 0 6px;color:#ffd34d;font-size:26px}
.card p{margin:6px 0;font-size:16px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;background:#0005;border-radius:12px;padding:7px 11px;margin:5px 0;text-align:left;gap:8px;font-size:15px}
.row b{font-size:17px;white-space:nowrap}
.row.tot{background:#3e8f1f66;border:1px solid #9cf07a88}
.note{font-size:13px;opacity:.85;margin:6px 0 10px}
.how{text-align:left;background:#0005;border-radius:12px;padding:7px 11px;font-size:14.5px;line-height:1.4;margin:6px 0}
.pros{font-size:40px;line-height:1}
#call{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:44px;font-weight:900;color:#ffd34d;text-shadow:0 3px 0 #7a4a00,0 0 20px #ff9800;pointer-events:none;opacity:0;z-index:10}
#call.go{animation:call 1.3s ease-out}
@keyframes call{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.2)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#bub{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
#bub.on{opacity:1}
#bub span{background:#fff7e0;color:#3a2205;border-radius:14px;padding:6px 10px;font-weight:800;font-size:15px;box-shadow:0 2px 0 #0006}
#bub em{font-style:normal;font-size:34px}
@media (max-height:700px){.pros{font-size:30px}.card h2{font-size:22px;margin:0 0 4px}.row{padding:5px 10px;margin:4px 0}.card p{font-size:15px;margin:4px 0}.btn.big{padding:13px}#hud .big{font-size:18px}}
#snd{background:none;border:none;font-size:20px;padding:2px 6px;color:#fff}
</style></head><body>
<div id="app">
 <div class="top"><span class="pill">⛏️ Level 15 bonus</span><span class="pill" id="phase">🤠 Gold Robbers</span><span class="pill" id="tm">⏱ 25</span><button id="snd" aria-label="Sound on/off">🔊</button></div>
 <div id="hud">
  <div class="box"><div class="big" id="hRisk">120 oz</div><div class="lbl">Gold at risk</div></div>
  <div class="box red"><div class="big" id="hStolen">0 oz</div><div class="lbl">Stolen</div></div>
  <div class="box grn"><div class="big" id="hStop">0</div><div class="lbl">Robbers stopped</div></div>
 </div>
 <div id="bar"><i id="barI"></i></div>
 <div id="wrap"><canvas id="cv"></canvas><div id="call"></div><div id="bub"><em>🤠</em><span id="bubT"></span></div>
  <div class="ov on" id="ov"><div class="card" id="card"></div></div>
 </div>
 <div id="foot">🔒 Robbers can't touch gold you bought · Preview only, not the real game</div>
</div>
<script>
const $=id=>document.getElementById(id);
const START_OZ=1200, BOUGHT_OZ=300, CAP=Math.round(START_OZ*0.10), PER=15, PERFECT_BONUS=25;
const DEFEND_S=25, CHASE_S=10;
let AC=null,muted=false,vbuf={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d=.12,type='square',vol=.08,slide=0,delay=0){if(muted||!AC)return;try{if(AC.state==='suspended')AC.resume();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.25,vol=.2,delay=0){if(muted||!AC)return;try{const t=AC.currentTime+delay,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t)}catch(e){}}
const SFX={
 bonk:()=>{noise(.12,.18);tone(320,.12,'triangle',.12,-150)},
 coin:(n=0)=>{const f=660*Math.pow(1.06,n);tone(f,.09,'square',.05,0);tone(f*1.5,.12,'square',.05,0,.07)},
 steal:()=>{tone(300,.25,'sawtooth',.05,-180)},
 whistle:()=>{tone(1200,.18,'sine',.06,600);tone(1800,.25,'sine',.05,-700,.2)},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'square',.06,0,i*.12))},
 click:()=>tone(880,.05,'square',.04)};
function vload(k){if(vbuf[k]||!AC)return vbuf[k];vbuf[k]=fetch(k+'.mp3?v=1').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)));vbuf[k].catch(()=>{vbuf[k]=null});return vbuf[k]}
function voice(k){if(muted||!AC)return;const p=vload(k);if(p)p.then(buf=>{if(muted)return;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.1;s.buffer=buf;s.connect(g);g.connect(AC.destination);s.start()}).catch(()=>{})}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊'};

const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);
const pile=()=>({x:W/2,y:H*.80,r:Math.min(W,H)*.15});

// ---------- game state ----------
let G=null;window.__G=()=>G;
function fresh(){return{phase:'intro',t:0,robbers:[],sacks:[],fx:[],stolen:0,saved:0,stopped:0,escaped:[],recovered:0,caught:0,spawnT:0,spawned:0,chasers:[],dust:[]}}
G=fresh();
function setHud(){$('hStolen').textContent=Math.round(G.stolen-G.recovered)+' oz';$('hStop').textContent=G.phase==='chase'?G.caught+' caught':G.stopped;$('barI').style.width=Math.min(100,(G.stolen-G.recovered)/CAP*100)+'%';$('hRisk').textContent=CAP+' oz'}
function call(t){const c=$('call');c.innerHTML=t;c.classList.remove('go');void c.offsetWidth;c.classList.add('go')}
let bubTO;function bub(t,ms=2200){$('bubT').textContent=t;$('bub').classList.add('on');clearTimeout(bubTO);bubTO=setTimeout(()=>$('bub').classList.remove('on'),ms)}
function float(x,y,txt,col='#ffd34d'){x=Math.max(45,Math.min(W-45,x));y=Math.max(24,y);G.fx.push({x,y,txt,col,life:1})}

function intro(){
 $('card').innerHTML=`<div class="pros">🤠</div><h2>Gold Robbers!</h2>
 <p><b>Every 15 levels</b>, sneaky bandits come for your gold!</p>
 <div class="how">👆 <b>Tap or swipe</b> robbers to stop them.<br>💰 Any who reach your pile grab ${PER} oz.<br>🏃 Then <b>Chase!</b> Tap them to win it back.</div>
 <div class="row"><span>Gold you dug</span><b>${START_OZ.toLocaleString()} oz</b></div>
 <div class="row"><span>Most they can take (10%)</span><b>${CAP} oz</b></div>
 <p class="note">🔒 Robbers can't touch gold you bought (your ${BOUGHT_OZ} oz is safe).</p>
 <button class="btn g big" id="go">Defend my gold!</button>`;
 $('ov').classList.add('on');$('go').onclick=()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();['smokes','win1','hoser','close1'].forEach(vload);SFX.click();startDefend()};
}
function startDefend(){G=fresh();G.phase='defend';G.t=DEFEND_S;$('ov').classList.remove('on');$('phase').textContent='🛡 Defend!';setHud();call('Robbers!');voice('smokes');setTimeout(()=>bub('Tap \'em before they grab yer gold!'),900);SFX.whistle()}
function spawnRobber(){
 const p=pile(),el=DEFEND_S-G.t,k=el/DEFEND_S;const side=Math.random();let x,y;
 if(side<.5){x=40+Math.random()*(W-80);y=-30}else if(side<.75){x=-30;y=20+Math.random()*H*.35}else{x=W+30;y=20+Math.random()*H*.35}
 const sp=(70+k*70)*(H/560)*(0.9+Math.random()*.25);
 G.robbers.push({x,y,state:'run',sp,ph:Math.random()*6,wob:Math.random()*6,face:x<p.x?1:-1,id:++G.spawned,scale:Math.max(1.15,Math.min(1.6,W/300))});
}
function startChase(){
 G.phase='chase';G.t=CHASE_S;$('phase').textContent='🏃 Chase!';call('Chase!');bub('After \'em, partner!');SFX.whistle();
 G.robbers=[];const n=G.escaped.length,top=H*.08,span=H*.62;
 G.escaped.forEach((amt,i)=>{const dir=i%2?-1:1,lane=top+span*((i%5)+.5)/5;G.chasers.push({x:dir>0?-40-i*55:W+40+i*55,y:lane,dir,amt,sp:(110+Math.random()*50)*(W/390),turns:1,state:'flee',ph:Math.random()*6,scale:Math.max(1.15,Math.min(1.6,W/300))})});
 setHud();
}
function endGame(){
 G.phase='done';$('phase').textContent='🏁 Results';$('tm').textContent='⏱ 0';
 const lost=G.stolen-G.recovered,perfect=G.stolen===0,bonus=perfect?PERFECT_BONUS:0,keep=START_OZ-lost+bonus;
 if(perfect){SFX.win();voice('hoser')}else if(lost===0){SFX.win();voice('win1')}else voice(lost>CAP/2?'close1':'win1');
 const savedOz=CAP-G.stolen;
 $('card').innerHTML=`<div class="pros">${perfect?'🏆':'🤠'}</div><h2>${perfect?'Perfect defense!':lost===0?'Got it all back!':'Robbers run off!'}</h2>
 <div class="row"><span>🤠 Robbers stopped</span><b>${G.stopped}</b></div>
 <div class="row"><span>🛡 Saved by defending</span><b>${savedOz} oz</b></div>
 <div class="row"><span>💰 Gold stolen</span><b>${G.stolen} oz${G.stolen>=CAP?' (max)':''}</b></div>
 ${G.stolen?`<div class="row"><span>🏃 Won back in the chase</span><b>+${G.recovered} oz</b></div>`:''}
 <div class="row"><span>⭐ Perfect defense bonus</span><b>${perfect?'+'+PERFECT_BONUS+' oz':'—'}</b></div>
 <div class="row tot"><span>Your gold now</span><b>${keep.toLocaleString()} oz</b></div>
 <p class="note">${perfect?'Not one robber got through!':lost?`They got away with ${lost} oz this time.`:'Every last nugget came home.'}<br>🔒 Your ${BOUGHT_OZ} oz of bought gold was never at risk.</p>
 <button class="btn g big" id="again">Play again</button>`;
 $('ov').classList.add('on');$('again').onclick=()=>{SFX.click();startDefend()};
}

// ---------- input: tap or swipe ----------
let down=false,last=null;
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hitAt(x,y){
 const R=34;
 if(G.phase==='defend'){for(const r of G.robbers){if(r.state!=='run')continue;const dx=r.x-x,dy=(r.y-14*r.scale)-y;if(dx*dx+dy*dy<(R*r.scale)*(R*r.scale)*1.4){stopRobber(r);return true}}}
 if(G.phase==='chase'){for(const c of G.chasers){if(c.state!=='flee')continue;const dx=c.x-x,dy=(c.y-14*c.scale)-y;if(dx*dx+dy*dy<(R*c.scale)*(R*c.scale)*1.6){catchChaser(c);return true}}}
 return false}
function sweep(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/12));for(let i=1;i<=n;i++)hitAt(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;last=pt(e);hitAt(last.x,last.y)});
cv.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e);sweep(last,p);last=p});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{down=false}));
function stopRobber(r){r.state='scared';r.t=0;G.stopped++;G.saved+=PER;SFX.bonk();const p=pile();
 G.sacks.push({x:r.x+8*r.face,y:r.y-6,tx:p.x,ty:p.y-10,t:0});float(r.x,r.y-50,['Eek!','Yikes!','Oof!','Run!'][G.stopped%4],'#fff');
 const ang=Math.atan2(r.y-p.y,r.x-p.x);r.vx=Math.cos(ang)*260;r.vy=Math.sin(ang)*260-60;r.face=r.vx>0?1:-1;setHud();
 if(G.stopped%5===0)bub(['Nice work, bud!','Beauty, eh!','Keep it up!'][(G.stopped/5|0)%3],1500)}
function catchChaser(c){c.state='caught';c.t=0;G.recovered+=c.amt;G.caught++;SFX.bonk();SFX.coin(G.caught);float(c.x,c.y-50,'+'+c.amt+' oz','#9cf07a');
 G.sacks.push({x:c.x,y:c.y-6,tx:W/2,ty:-20,t:0,up:1});c.vx=-c.dir*0;setHud()}

// ---------- drawing ----------
function nugget(x,y,r,t,seed=0){const g=cx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);g.addColorStop(0,'#fff6b0');g.addColorStop(.4,'#ffd34d');g.addColorStop(1,'#b87a08');
 cx.save();cx.shadowColor='#ffb000';cx.shadowBlur=10+Math.sin(t/200+seed)*5;cx.fillStyle=g;cx.beginPath();cx.ellipse(x,y,r,r*.8,.4+seed,0,7);cx.fill();cx.restore();
 cx.fillStyle='#fff';cx.globalAlpha=.4+.4*Math.sin(t/180+seed*2);cx.beginPath();cx.arc(x-r*.35,y-r*.3,r*.18,0,7);cx.fill();cx.globalAlpha=1}
function drawBg(t){
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6a3f1c');g.addColorStop(.35,'#a86a2e');g.addColorStop(1,'#7a4a20');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 // far mesas
 cx.fillStyle='#8a4f22';cx.beginPath();cx.moveTo(0,H*.18);cx.lineTo(W*.12,H*.12);cx.lineTo(W*.3,H*.12);cx.lineTo(W*.36,H*.2);cx.lineTo(W*.62,H*.2);cx.lineTo(W*.7,H*.1);cx.lineTo(W*.9,H*.1);cx.lineTo(W,H*.17);cx.lineTo(W,H*.26);cx.lineTo(0,H*.26);cx.fill();
 // ground specks
 cx.fillStyle='#0002';for(let i=0;i<40;i++){const x=(i*97)%W,y=H*.28+((i*53)%100)/100*H*.7;cx.beginPath();cx.ellipse(x,y,3+(i%3),2,0,0,7);cx.fill()}
 // cacti
 cactus(W*.08,H*.42,.8);cactus(W*.92,H*.58,1);cactus(W*.15,H*.9,.7);
 // mine cart + pile
 const p=pile();cx.fillStyle='#0004';cx.beginPath();cx.ellipse(p.x,p.y+p.r*.45,p.r*1.3,p.r*.35,0,0,7);cx.fill();
 const left=Math.max(0,1-(G.stolen-G.recovered)/CAP*.5),n=Math.round(14*left);
 const spots=[[0,0],[-.5,.1],[.5,.1],[-.25,-.25],[.25,-.25],[0,-.5],[-.8,.25],[.8,.25],[-.55,-.1],[.55,-.1],[-.3,.3],[.3,.3],[0,.3],[0,-.75]];
 for(let i=0;i<n;i++){const s=spots[i];nugget(p.x+s[0]*p.r,p.y+s[1]*p.r,p.r*(.28-(i>9?.06:0)),t,i)}
 cx.font=`900 ${Math.round(p.r*.32)}px system-ui`;cx.textAlign='center';cx.fillStyle='#fff7e0';cx.strokeStyle='#3a2205';cx.lineWidth=4;
 const lbl=G.phase==='chase'?'':'Your gold';cx.strokeText(lbl,p.x,p.y+p.r*.95);cx.fillText(lbl,p.x,p.y+p.r*.95);
}
function cactus(x,y,s){cx.fillStyle='#4e7a2e';cx.strokeStyle='#2b4a17';cx.lineWidth=2;const w=10*s,h=44*s;
 cx.beginPath();cx.roundRect?cx.roundRect(x-w/2,y-h,w,h,w/2):cx.rect(x-w/2,y-h,w,h);cx.fill();cx.stroke();
 cx.beginPath();cx.roundRect?cx.roundRect(x-w*1.6,y-h*.75,w*.8,h*.4,w*.4):0;cx.fill();cx.beginPath();cx.roundRect?cx.roundRect(x+w*.8,y-h*.85,w*.8,h*.35,w*.4):0;cx.fill()}
// cartoon bandit: hat, black eye mask, striped shirt, sack on shoulder (no weapons)
function bandit(x,y,face,s,t,ph,opts={}){
 cx.save();cx.translate(x,y);cx.scale(s*face,s);
 const step=Math.sin(t/70+ph),bob=Math.abs(step)*3;
 cx.fillStyle='#0003';cx.beginPath();cx.ellipse(0,0,16,5,0,0,7);cx.fill();
 cx.translate(0,-bob);
 // legs
 cx.strokeStyle='#3b2a55';cx.lineWidth=6;cx.lineCap='round';cx.beginPath();cx.moveTo(-4,-14);cx.lineTo(-4+step*7,-1);cx.moveTo(4,-14);cx.lineTo(4-step*7,-1);cx.stroke();
 cx.fillStyle='#2a1a0e';cx.beginPath();cx.ellipse(-4+step*7+2,0,5,3,0,0,7);cx.ellipse(4-step*7+2,0,5,3,0,0,7);cx.fill();
 // body striped
 cx.fillStyle='#e8e0d0';cx.beginPath();cx.roundRect?cx.roundRect(-10,-34,20,22,7):cx.rect(-10,-34,20,22);cx.fill();
 cx.fillStyle='#2a2a3a';for(let i=0;i<3;i++)cx.fillRect(-10,-31+i*7,20,3);
 // arm
 cx.strokeStyle='#e8e0d0';cx.lineWidth=5;cx.beginPath();cx.moveTo(4,-30);cx.lineTo(opts.noSack?14:-2,opts.noSack?-36+step*3:-40);cx.stroke();
 // head
 cx.fillStyle='#f2c08a';cx.beginPath();cx.arc(0,-44,11,0,7);cx.fill();
 // mask
 cx.fillStyle='#111';cx.beginPath();cx.roundRect?cx.roundRect(-11,-49,23,7,3):cx.rect(-11,-49,23,7);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(2,-45.5,2.4,0,7);cx.arc(8,-45.5,2.4,0,7);cx.fill();cx.fillStyle='#000';cx.beginPath();cx.arc(3,-45.5,1.2,0,7);cx.arc(9,-45.5,1.2,0,7);cx.fill();
 // mouth
 cx.strokeStyle='#6a2a10';cx.lineWidth=1.6;cx.beginPath();if(opts.scared){cx.arc(5,-37,2.5,0,7)}else{cx.arc(5,-39,3,.2,Math.PI-.2)}cx.stroke();
 // hat
 cx.fillStyle='#5a3a1c';cx.beginPath();cx.ellipse(0,-53,16,4,0,0,7);cx.fill();cx.beginPath();cx.roundRect?cx.roundRect(-9,-66,18,13,5):cx.rect(-9,-66,18,13);cx.fill();cx.fillStyle='#c8962e';cx.fillRect(-9,-57,18,3);
 // sack
 if(!opts.noSack){cx.save();cx.translate(-10,-44);cx.fillStyle='#c9a46a';cx.strokeStyle='#7a5a2a';cx.lineWidth=2;cx.beginPath();cx.ellipse(0,0,11,13,-.3,0,7);cx.fill();cx.stroke();
  cx.fillStyle='#7a5a2a';cx.fillRect(-3,-15,6,4);cx.fillStyle=opts.full?'#ffd34d':'#7a5a2a';cx.font='bold 12px system-ui';cx.textAlign='center';cx.save();cx.scale(face,1);cx.fillText('$',0,5);cx.restore();cx.restore()}
 if(opts.scared){cx.fillStyle='#bfe4ff';cx.beginPath();cx.ellipse(13,-55,2.5,4,0,0,7);cx.fill()}
 cx.restore()}
function sack(x,y){cx.fillStyle='#c9a46a';cx.strokeStyle='#7a5a2a';cx.lineWidth=2;cx.beginPath();cx.ellipse(x,y,10,12,0,0,7);cx.fill();cx.stroke();cx.fillStyle='#ffd34d';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText('$',x,y+5)}

// ---------- loop ----------
let lt=performance.now();
function frame(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;if(!W)size();
 if(G.phase==='defend'||G.phase==='chase'){G.t-=dt;$('tm').textContent='⏱ '+Math.max(0,Math.ceil(G.t))}
 if(G.phase==='defend'){
  const el=DEFEND_S-G.t,iv=1.35-.75*(el/DEFEND_S);G.spawnT-=dt;
  if(G.t>2.2&&G.spawnT<=0){spawnRobber();if(el>12&&Math.random()<.35)spawnRobber();G.spawnT=iv}
  const p=pile();
  for(const r of G.robbers){r.t=(r.t||0)+dt;
   if(r.state==='run'){const dx=p.x-r.x,dy=(p.y-p.r*.2)-r.y,d=Math.hypot(dx,dy);r.face=dx>0?1:-1;const wob=Math.sin(r.t*3+r.wob)*.5;
    r.x+=(dx/d*Math.cos(wob)-dy/d*Math.sin(wob)*.5)*r.sp*dt;r.y+=(dy/d)*r.sp*dt;
    if(d<p.r*.9){const take=Math.min(PER,CAP-G.stolen);G.stolen+=take;r.state='escape';r.amt=take;if(take>0)G.escaped.push(take);r.vx=(r.x<W/2?-1:1)*170;r.vy=-200;r.face=r.vx>0?1:-1;SFX.steal();float(r.x,r.y-60,take?'-'+take+' oz':'Empty!','#ff8a6a');setHud();if(G.escaped.length===1)bub('Hey! Come back here!',1500)}}
   else{r.x+=r.vx*dt;r.y+=r.vy*dt}}
  G.robbers=G.robbers.filter(r=>r.state==='run'||(r.x>-80&&r.x<W+80&&r.y>-100&&r.y<H+100));
  if(G.t<=0){const left=G.robbers.filter(r=>r.state==='run');left.forEach(r=>{r.state='scared';r.vx=(r.x<W/2?-1:1)*260;r.vy=-60});
   G.robbers=[];if(G.escaped.length){G.phase='pause';setTimeout(startChase,900)}else{G.phase='pause';call('No robbers got through!');setTimeout(endGame,1300)}}
 }
 if(G.phase==='chase'){let alive=0;
  for(const c of G.chasers){if(c.state==='flee'){alive++;c.x+=c.dir*c.sp*dt;if((c.dir>0&&c.x>W+40)||(c.dir<0&&c.x<-40)){if(c.turns>0){c.turns--;c.dir*=-1;c.y+=H*.06}else c.state='gone'}}
   else if(c.state==='caught'){c.t+=dt;c.x-=c.dir*240*dt;c.y-=40*dt}}
  if(G.t<=0||alive===0){const got=G.recovered;G.phase='pause';if(alive===0&&G.recovered===G.stolen)call('Got it all back!');else call(got?'+'+got+' oz back!':'They got away!');setTimeout(endGame,1300)}
 }
 const t=now;drawBg(t);
 for(const s of G.sacks){s.t+=dt*1.6;const k=Math.min(1,s.t);const x=s.x+(s.tx-s.x)*k,y=s.y+(s.ty-s.y)*k-Math.sin(k*Math.PI)*60;sack(x,y);if(k>=1&&!s.done){s.done=1;SFX.coin(2)}}
 G.sacks=G.sacks.filter(s=>!s.done);
 for(const r of G.robbers){bandit(r.x,r.y,r.face,r.scale,t,r.ph,{noSack:r.state==='scared',scared:r.state==='scared',full:r.state==='escape'})}
 if(G.phase==='chase'||G.phase==='pause'||G.phase==='done')for(const c of G.chasers){if(c.state==='flee')bandit(c.x,c.y,c.dir,c.scale,t,c.ph,{full:1});else if(c.state==='caught')bandit(c.x,c.y,-c.dir,c.scale,t,c.ph,{noSack:1,scared:1})}
 if(G.phase==='chase'){cx.fillStyle='#0005';cx.fillRect(0,H*.88,W,H*.12);cx.fillStyle='#fff7e0';cx.font='800 15px system-ui';cx.textAlign='center';cx.fillText('Tap robbers with sacks to win gold back!',W/2,H*.95)}
 for(const f of G.fx){f.life-=dt*.9;f.y-=40*dt;cx.globalAlpha=Math.max(0,f.life);cx.font='900 20px system-ui';cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#3a2205';cx.strokeText(f.txt,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.txt,f.x,f.y);cx.globalAlpha=1}
 G.fx=G.fx.filter(f=>f.life>0);
 requestAnimationFrame(frame)}
size();intro();setHud();requestAnimationFrame(frame);
</script></body></html>
