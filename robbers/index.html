<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gold Robbers v3 – Gold Fever Frenzy preview</title>
<meta name="theme-color" content="#2a1a0e">
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b120a;color:#fff7e0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#3b2614,#2a1a0e);border-bottom:2px solid #5a3a1c;gap:4px}
.pill{background:#00000055;border:1px solid #c8962e88;border-radius:20px;padding:5px 9px;font-weight:700;font-size:14px;white-space:nowrap}
#hud{display:flex;justify-content:space-around;align-items:center;padding:5px;background:#2a1a0e;gap:4px}
#hud .box{text-align:center;background:#0006;border-radius:12px;padding:3px 8px;min-width:84px}
#hud .big{font-size:19px;font-weight:900}
#hud .lbl{font-size:11px;opacity:.8}
#hud .box.red .big{color:#ff8a6a}
#hud .box.grn .big{color:#9cf07a}
#bar{height:7px;margin:0 10px 3px;background:#0006;border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a3a,#e0402a);transition:width .2s}
#wrap{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctl{display:flex;gap:6px;align-items:stretch;padding:6px 8px;background:linear-gradient(#3b2614,#2a1a0e);border-top:2px solid #5a3a1c}
#wps{display:flex;gap:5px;flex:1.35}
.wp{flex:1;min-width:0;border-radius:12px;border:2px solid #5a3a1c;background:#0006;color:#fff7e0;font-family:inherit;font-weight:800;font-size:11.5px;line-height:1.1;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
.wp canvas{width:52px;height:30px}
.wp.on{border-color:#ffd34d;background:#6a4a00;box-shadow:0 0 10px #ffb00088}
.wp.lock{opacity:.55}.wp.lock canvas{filter:grayscale(1) brightness(.6)}
.wp .lk{font-size:10px;font-weight:700;opacity:.9}
.wp.new{animation:pulse .5s 6 alternate}
@keyframes pulse{to{transform:scale(1.1)}}
#rel{flex:1;border:none;border-radius:16px;background:linear-gradient(#ffd34d,#e09a12);color:#3a2205;font-family:inherit;font-weight:900;font-size:21px;box-shadow:0 4px 0 #8a5a08;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;min-height:68px;position:relative;overflow:hidden}
#rel:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a08}
#rel canvas{width:100%;max-width:150px;height:20px;margin-top:3px}
#rel i{position:absolute;left:0;bottom:0;height:5px;background:#3a2205;width:0}
#rel.warn{background:linear-gradient(#ff7a5a,#c0301a);color:#fff;animation:warn .35s infinite alternate;box-shadow:0 4px 0 #6a1408}
#rel.full{filter:saturate(.75) brightness(.92)}
@keyframes warn{to{transform:scale(1.05)}}
#foot{text-align:center;font-size:11.5px;opacity:.8;padding:3px 8px calc(4px + env(safe-area-inset-bottom));background:#2a1a0e}
.btn{background:linear-gradient(#ffd34d,#e09a12);color:#3a2205;border:none;border-radius:14px;padding:14px 22px;font-weight:800;font-size:19px;box-shadow:0 4px 0 #8a5a08;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a08}
.btn.g{background:linear-gradient(#8fd16a,#4e9a2e);color:#0f2a05;box-shadow:0 4px 0 #2b5a17}
.btn.big{width:100%;font-size:22px;padding:14px}
.btn.lite{background:#0006;color:#fff7e0;box-shadow:none;border:1px solid #c8962e88;font-size:15px;padding:10px;width:100%;margin-top:8px}
.ov{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:6px}
.ov.on{display:flex}
#pop{z-index:25;background:#0009}
.card{background:linear-gradient(#4a3018,#2a1a0e);border:3px solid #c8962e;border-radius:20px;padding:14px;width:92%;max-width:400px;text-align:center;max-height:98%;overflow:auto}
#popC{animation:popin .35s ease-out;border-color:#ffd34d;box-shadow:0 0 30px #ffb000aa}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.card h2{margin:2px 0 6px;color:#ffd34d;font-size:26px}
.card p{margin:5px 0;font-size:16px;line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;background:#0005;border-radius:12px;padding:6px 11px;margin:4px 0;text-align:left;gap:8px;font-size:15px}
.row b{font-size:17px;white-space:nowrap}
.row.tot{background:#3e8f1f66;border:1px solid #9cf07a88}
.note{font-size:13px;opacity:.85;margin:6px 0 10px}
.how{text-align:left;background:#0005;border-radius:12px;padding:7px 11px;font-size:14px;line-height:1.38;margin:6px 0}
.pros{font-size:36px;line-height:1}
#call{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:40px;font-weight:900;color:#ffd34d;text-shadow:0 3px 0 #7a4a00,0 0 20px #ff9800;pointer-events:none;opacity:0;z-index:10}
#call small{display:block;font-size:20px;color:#fff7e0}
#call.go{animation:call 1.5s ease-out}
@keyframes call{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1.2)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#bub{position:absolute;left:6px;bottom:140px;max-width:54%;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
#bub.on{opacity:1}
#bub span{background:#fff7e0;color:#3a2205;border-radius:14px;padding:5px 9px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #0006}
#bub em{font-style:normal;font-size:28px}
#snd{background:none;border:none;font-size:20px;padding:2px 6px;color:#fff}
#ctl.off{display:none}
@media (max-height:700px){.pros{font-size:24px}.card h2{font-size:22px;margin:0 0 4px}.row{padding:4px 10px;margin:3px 0}.card p{font-size:14.5px;margin:3px 0}.btn.big{padding:12px}#hud .big{font-size:17px}.how{font-size:12.5px;line-height:1.3}.note{margin:4px 0 6px}#rel{min-height:58px;font-size:19px}.wp canvas{height:24px}}
</style></head><body>
<div id="app">
 <div class="top"><span class="pill">⛏️ Level 15 bonus</span><span class="pill" id="phase">🤠 Gold Robbers</span><span class="pill" id="tm">⏱ 40</span><button id="snd" aria-label="Sound on/off">🔊</button></div>
 <div id="hud">
  <div class="box"><div class="big" id="hRisk">120 oz</div><div class="lbl">Gold at risk</div></div>
  <div class="box red"><div class="big" id="hStolen">0 oz</div><div class="lbl">Stolen</div></div>
  <div class="box grn"><div class="big" id="hStop">0</div><div class="lbl" id="hStopL">Robbers stopped</div></div>
 </div>
 <div id="bar"><i id="barI"></i></div>
 <div id="wrap"><canvas id="cv"></canvas><div id="call"></div><div id="bub"><em>🤠</em><span id="bubT"></span></div>
  <div class="ov" id="pop"><div class="card" id="popC"></div></div>
  <div class="ov on" id="ov"><div class="card" id="card"></div></div>
 </div>
 <div id="ctl" class="off">
  <div id="wps">
   <button class="wp on" data-w="six"><canvas width="156" height="90"></canvas><span class="am">6/6</span></button>
   <button class="wp lock" data-w="dbl"><canvas width="156" height="90"></canvas><span class="am lk">🔒 Stop 8</span></button>
   <button class="wp lock" data-w="rif"><canvas width="156" height="90"></canvas><span class="am lk">🔒 Wave 3</span></button>
  </div>
  <button id="rel" aria-label="Reload"><span id="relT">RELOAD</span><canvas id="pips" width="450" height="60"></canvas><i id="relP"></i></button>
 </div>
 <div id="foot">🔒 Robbers can't touch gold you bought · Upgrades are earned in play, never sold · Preview v3</div>
</div>
<script>
const $=id=>document.getElementById(id);
const START_OZ=1200,BOUGHT_OZ=300,CAP=Math.round(START_OZ*.10),PERFECT_BONUS=25;
const TAKE={norm:15,fast:15,tough:20,boss:30};
const DEFEND_MAX=48,CHASE_S=10;
const WDEF={
 six:{name:'Six-shooter',short:'Six-gun',mag:6,cool:.15,dmg:1,sp:950,base:.3,per:.2,seek:.3},
 dbl:{name:'Double Six-Shooters',short:'Doubles',mag:12,cool:.075,dmg:1,sp:950,base:.45,per:.2,seek:.3},
 rif:{name:'Cork Rifle',short:'Rifle',mag:4,cool:.55,dmg:2,sp:1500,base:.45,per:.6,seek:.25}};
const UNLOCK={dbl:{stop:8,wave:1,label:'Stop 8'},rif:{stop:20,wave:2,label:'Wave 3'}};
const WAVES=[[0,8,1.0,1,0],[10,11,.85,3,2],[22,14,.62,4,4]]; // start, count, gap, fast, tough
const BOSS_AT=31;
// ---------- sound (same synth helpers as the game) ----------
let AC=null,muted=false,vbuf={};
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d=.12,type='square',vol=.08,slide=0,delay=0){if(muted||!AC)return;try{if(AC.state==='suspended')AC.resume();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.25,vol=.2,delay=0,freq=700,type='lowpass'){if(muted||!AC)return;try{const t=AC.currentTime+delay,b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;s.buffer=b;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t)}catch(e){}}
const SFX={
 pop:()=>{noise(.07,.35,0,2500,'bandpass');tone(900,.06,'square',.05,-500)},
 rifle:()=>{noise(.12,.45,0,1500,'bandpass');tone(500,.12,'square',.06,-300)},
 bonk:()=>{tone(520,.1,'triangle',.12,-300);noise(.08,.15)},
 thud:()=>{tone(260,.12,'triangle',.12,-100)},
 empty:()=>{tone(1800,.03,'square',.05);tone(1400,.03,'square',.04,0,.05)},
 load:(i)=>tone(1300+i*40,.035,'square',.035),
 swap:()=>{tone(700,.05,'square',.04);tone(1000,.05,'square',.04,0,.05)},
 unlock:()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.18,'square',.06,0,i*.08))},
 coin:(n=0)=>{const f=660*Math.pow(1.06,n);tone(f,.09,'square',.05,0);tone(f*1.5,.12,'square',.05,0,.07)},
 steal:()=>{tone(300,.25,'sawtooth',.05,-180)},
 whistle:()=>{tone(1200,.18,'sine',.06,600);tone(1800,.25,'sine',.05,-700,.2)},
 boss:()=>{[196,185,175,165].forEach((f,i)=>tone(f,.22,'sawtooth',.05,0,i*.18))},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'square',.06,0,i*.12))},
 click:()=>tone(880,.05,'square',.04)};
function vload(k){if(vbuf[k]||!AC)return vbuf[k];vbuf[k]=fetch(k+'.mp3?v=3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)));vbuf[k].catch(()=>{vbuf[k]=null});return vbuf[k]}
function voice(k){if(muted||!AC)return;const p=vload(k);if(p)p.then(buf=>{if(muted)return;const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.1;s.buffer=buf;s.connect(g);g.connect(AC.destination);s.start()}).catch(()=>{})}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊'};

const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function size(){const r=cv.getBoundingClientRect();DPR=Math.min(3,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);if(G&&G.me)G.me.x=Math.max(60,Math.min(W-60,G.me.x||W/2))}
addEventListener('resize',()=>{size();drawIcons()});
const pile=()=>({x:W/2,y:H*.6,r:Math.min(W,H)*.13});
const groundY=()=>H-12;
const SC=()=>Math.max(1.0,Math.min(1.4,W/310));

let G=null;window.__G=()=>G;
function fresh(){return{phase:'intro',t:0,el:0,paused:false,robbers:[],corks:[],sacks:[],fx:[],puffs:[],hats:[],stolen:0,stopped:0,tough:0,escaped:[],recovered:0,caught:0,queue:[],chasers:[],shots:0,hits:0,
 wpn:{six:{ammo:6,unl:true},dbl:{ammo:12,unl:false},rif:{ammo:4,unl:false}},cur:'six',rl:null,cool:0,hand:0,unlocked:[],
 me:{x:W/2||180,aim:-Math.PI/2,kick:0,kick2:0,walk:0},bossDone:false,wave:0}}
G=fresh();
function buildQueue(){const q=[];WAVES.forEach((w,wi)=>{const idx=[...Array(w[1]-1)].map((_,i)=>i+1).sort(()=>Math.random()-.5);const fast=new Set(idx.slice(0,w[3])),tough=new Set(idx.slice(w[3],w[3]+w[4]));
 for(let i=0;i<w[1];i++)q.push({at:w[0]+i*w[2]+Math.random()*.25,type:fast.has(i)?'fast':tough.has(i)?'tough':'norm',wave:wi})});q.push({at:BOSS_AT,type:'boss',wave:2});return q.sort((a,b)=>a.at-b.at)}
function setHud(){const lost=G.stolen-G.recovered;$('hStolen').textContent=Math.round(lost)+' oz';$('hStop').textContent=G.phase==='chase'?G.caught:G.stopped;$('hStopL').textContent=G.phase==='chase'?'Robbers caught':'Robbers stopped';$('barI').style.width=Math.min(100,lost/CAP*100)+'%'}
function call(t,sub=''){const c=$('call');c.innerHTML=t+(sub?`<small>${sub}</small>`:'');c.classList.remove('go');void c.offsetWidth;c.classList.add('go')}
let bubTO;function bub(t,ms=2000){$('bubT').textContent=t;$('bub').classList.add('on');clearTimeout(bubTO);bubTO=setTimeout(()=>$('bub').classList.remove('on'),ms)}
function float(x,y,txt,col='#ffd34d',sz=20){x=Math.max(50,Math.min(W-50,x));y=Math.max(24,y);G.fx.push({x,y,txt,col,sz,life:1})}

function intro(){
 $('ctl').classList.add('off');
 $('card').innerHTML=`<div class="pros">🤠</div><h2>Gold Robbers!</h2>
 <p><b>Every 15 levels</b> an outlaw gang comes for your gold!</p>
 <div class="how">👆 <b>Tap robbers</b> to fire corks. Aim counts!<br>🔄 Out of corks? Hit the big <b>RELOAD</b> button (anytime to top up).<br>⭐ Earn <b>Double Six-Shooters</b> and a <b>Cork Rifle</b> as you play. Tap a weapon to switch.<br>💪 <b>Tough</b> guys take 2 hits (rifle: 1). <b>Boss</b>: 4 (rifle: 2).<br>↔️ Drag along the bottom to move.</div>
 <div class="row"><span>Gold you dug</span><b>${START_OZ.toLocaleString()} oz</b></div>
 <div class="row"><span>Most they can take (10%)</span><b>${CAP} oz</b></div>
 <p class="note">🔒 Robbers can't touch gold you bought (your ${BOUGHT_OZ} oz is safe).</p>
 <button class="btn g big" id="go">Defend my gold!</button>`;
 $('ov').classList.add('on');$('go').onclick=()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();['smokes','win1','hoser','close1','strike'].forEach(vload);SFX.click();startDefend()};
}
function startDefend(){G=fresh();G.phase='defend';G.queue=buildQueue();$('ov').classList.remove('on');$('ctl').classList.remove('off');size();drawIcons();G.me.x=W/2;$('phase').textContent='🛡 Wave 1';setHud();updUI(true);call('Wave 1','Here they come!');voice('smokes');SFX.whistle()}

// ---------- robbers ----------
const COATS=[['#6b4423','#4a2e16'],['#4a4a52','#2e2e34'],['#7a5a32','#54391c'],['#3a4a3a','#253025']];
const BANDS=['#c0392b','#2a6ad0','#d07a1a','#7a2a8a'];
function spawn(q){const p=pile(),s=SC();const type=q.type;const sc=s*(type==='boss'?1.5:type==='tough'?1.2:1);
 const minY=Math.max(H*.2,95*sc);let x,y,fade=1;
 if(type==='boss'){x=Math.random()<.5?-50:W+50;y=minY+H*.05}
 else if(Math.random()<.7){x=Math.random()<.5?-40:W+40;y=minY+Math.random()*H*.22}
 else{x=W*.15+Math.random()*W*.7;y=minY;fade=0;puff(x,y-40*sc,1.6)} // pops out from behind the mesa
 const base=(58+q.wave*14)*(H/560);
 const hp=type==='boss'?4:type==='tough'?2:1;
 const r={x,y,type,state:'run',ph:Math.random()*6,wob:Math.random()*6,t:0,scale:sc,fade,
  sp:type==='boss'?base*.6:type==='fast'?base*1.75:type==='tough'?base*.8:base*(0.9+Math.random()*.25),hp,maxhp:hp,id:Math.random(),
  coat:type==='boss'?['#1e1e22','#0e0e10']:type==='tough'?['#7a1f1f','#4a1010']:COATS[(Math.random()*COATS.length)|0],
  band:type==='boss'?'#b01818':type==='fast'?'#2e9a3e':type==='tough'?'#222':BANDS[(Math.random()*BANDS.length)|0],
  vest:type==='fast'||type==='tough'||Math.random()<.3,hat:true,face:x<p.x?1:-1};
 G.robbers.push(r);
 if(type==='boss'){call('BOSS BANDIT!','4 hits, or 2 with the rifle');SFX.boss();bub('Big Bad Bart! Use the rifle!',2600)}
 if(type==='tough'&&!G.toughSeen){G.toughSeen=1;bub('Tough guy! 2 hits, or 1 rifle shot!',2400)}}
function hitRobber(r,dmg,x,y){
 if(r.state!=='run')return false;
 r.hp-=dmg;G.hits++;puff(x,y,dmg>1?1.7:1.3);G.fx.push({x:x+14,y:y-6,txt:dmg>1?'KA-POP!':'POP!',col:'#fff',sz:dmg>1?20:17,life:.7});
 if(r.hp>0){SFX.thud();if(r.hat){r.hat=false;hatFly(r)}else r.bandanaDown=true;r.stun=.4;float(r.x,r.y-110*r.scale,['Hey!','Grrr!','Ow, my hat!'][r.hp%3],'#fff',20);return true}
 SFX.bonk();r.state='scared';r.t=0;G.stopped++;if(r.type==='tough')G.tough++;if(r.hat){r.hat=false;hatFly(r)}
 const p=pile();G.sacks.push({x:r.x-10*r.face*r.scale,y:r.y-55*r.scale,tx:p.x,ty:p.y-10,t:0,boss:r.type==='boss'});
 float(r.x,r.y-95*r.scale,['Yikes!','My hat!','Skedaddle!','Aw shucks!','Run for it!','Yeeouch!'][(Math.random()*6)|0],'#fff');
 const ang=Math.atan2(r.y-p.y,r.x-p.x);r.vx=Math.cos(ang)*280;r.vy=Math.min(-80,Math.sin(ang)*280);r.face=r.vx>0?1:-1;
 if(r.type==='boss'){G.bossDone=true;call('Boss down!');voice('strike');coinBurst(r.x,r.y-40,14)}
 setHud();checkUnlocks();return true}
function hatFly(r){G.hats.push({x:r.x,y:r.y-72*r.scale,vx:(Math.random()-.5)*160,vy:-260,rot:0,vr:(Math.random()<.5?-1:1)*9,s:r.scale,col:r.type==='boss'?'#141414':'#3b2a1a',life:1.4})}
function puff(x,y,s=1){for(let i=0;i<6;i++)G.puffs.push({x:x+(Math.random()-.5)*14*s,y:y+(Math.random()-.5)*14*s,r:5*s+Math.random()*5*s,vr:40*s,life:.5})}
function coinBurst(x,y,n){for(let i=0;i<n;i++)G.fx.push({x,y,coin:1,vx:(Math.random()-.5)*300,vy:-200-Math.random()*200,life:1})}

// ---------- weapons ----------
function live(){return (G.phase==='defend'||G.phase==='chase')&&!G.paused}
function shoulder(h){const s=SC();return{x:G.me.x+(h?-12:10)*s,y:groundY()-58*s}}
function startReload(){const w=WDEF[G.cur],st=G.wpn[G.cur];if(!live()||G.rl||st.ammo>=w.mag)return;G.rl={w:G.cur,t:w.base};SFX.click();updUI()}
function switchTo(k){if(!G.wpn[k].unl||G.cur===k)return;G.cur=k;G.rl=null;G.cool=.12;SFX.swap();updUI(true)}
function shoot(tx,ty){
 if(!live())return false;const w=WDEF[G.cur],st=G.wpn[G.cur];
 if(G.cool>0)return false;
